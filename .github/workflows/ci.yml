name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer phpcs

  phpstan:
    name: PHPStan (level 5, report only)
    runs-on: ubuntu-latest
    # Report only for now: findings do not fail the build until the first
    # baseline is clean. Raise the level in phpstan.neon.dist over time.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: composer config --no-plugins allow-plugins.phpstan/extension-installer true
      - run: composer require --dev --no-interaction phpstan/phpstan szepeviktor/phpstan-wordpress phpstan/extension-installer
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: |
            tests
            docs
            vendor
            node_modules
            bin
            .github
          exclude-files: |
            .gitignore
            .distignore
            .gitattributes
            .editorconfig
            .wp-env.json
            composer.json
            composer.lock
            package.json
            package-lock.json
            phpcs.xml.dist
            phpstan.neon.dist
            SECURITY.md
            phpunit.xml.dist
            playwright.config.js
          ignore-warnings: true

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }} / WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wp: '6.7.2'
          - php: '8.2'
            wp: 'latest'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
          extensions: mysqli, xml, mbstring
      - name: Install SVN and MySQL client
        # Install only what the runner image lacks. A broken third-party apt source
        # can make "apt-get update" exit 100 even when the packages are available,
        # so a failed update is not fatal; the install is retried and is.
        run: |
          NEED=""
          command -v svn >/dev/null 2>&1 || NEED="$NEED subversion"
          command -v mysqladmin >/dev/null 2>&1 || NEED="$NEED mysql-client"
          echo "Missing tools:${NEED:- none}"
          if [ -n "$NEED" ]; then
            for attempt in 1 2 3; do
              sudo apt-get update -o Acquire::Retries=3 || echo "apt-get update failed, continuing"
              if sudo apt-get install -y --no-install-recommends $NEED; then
                break
              fi
              echo "apt install attempt $attempt failed"
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 15
            done
          fi
      - run: composer install --no-interaction --prefer-dist
      - name: Install WordPress test suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
          WP_CORE_DIR: /tmp/wordpress
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }}
      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: vendor/bin/phpunit --configuration phpunit.xml.dist

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start wp-env
        run: npx wp-env start
      - name: Run E2E tests
        env:
          WP_BASE_URL: http://localhost:8888
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
