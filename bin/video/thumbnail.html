<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flipset YouTube thumbnail</title>
<style>
	@font-face { font-family: Outfit; src: url("../wporg-assets/fonts/outfit-latin.woff2") format("woff2"); font-weight: 100 900; }
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { width: 1280px; height: 720px; overflow: hidden; background: #0b1020; }
	body { position: relative; font-family: Outfit, "Segoe UI", sans-serif; color: #fff; }

	.bg { position: absolute; inset: 0;
		background:
			radial-gradient(760px 520px at 0% 0%, rgba(124, 58, 237, .6), transparent 62%),
			radial-gradient(820px 560px at 100% 100%, rgba(79, 70, 229, .65), transparent 60%),
			linear-gradient(135deg, #0b1020 0%, #151a33 100%); }
	.grid { position: absolute; inset: 0; opacity: .07;
		background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
		background-size: 48px 48px; mask-image: linear-gradient(90deg, transparent 5%, #000 60%, transparent 100%); }

	.copy { position: absolute; left: 70px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
	.brand { display: flex; align-items: center; gap: 20px; }
	.brand img { width: 92px; height: 92px; border-radius: 24px; box-shadow: 0 18px 40px -12px rgba(124, 58, 237, .85); }
	.brand b { font-size: 70px; font-weight: 700; letter-spacing: -1.5px; }
	h1 { font-size: 112px; line-height: .98; font-weight: 800; letter-spacing: -3px; color: #fff; text-shadow: 0 6px 30px rgba(0, 0, 0, .35); }
	h1 em { font-style: normal; display: block; background: linear-gradient(90deg, #a5b4fc, #f0abfc); -webkit-background-clip: text; background-clip: text; color: transparent; }
	.chip { align-self: flex-start; padding: 12px 28px; border-radius: 999px; font-size: 38px; font-weight: 600; color: #dfe4ff; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); }

	/* book */
	.stage { position: absolute; right: 30px; top: 0; width: 600px; height: 720px; perspective: 1900px; }
	.book { position: absolute; left: 30px; top: 190px; width: 540px; height: 360px; transform-style: preserve-3d; transform: rotateX(8deg) rotateY(-16deg) rotateZ(-2deg); }
	.shadow { position: absolute; left: 20px; right: 20px; bottom: -44px; height: 70px; background: radial-gradient(closest-side, rgba(0, 0, 0, .6), transparent); filter: blur(12px); }
	.page { position: absolute; top: 0; width: 270px; height: 360px; background: linear-gradient(90deg, #f4f1ea, #fffdf8 30%, #fff); overflow: hidden; }
	.page.l { left: 0; border-radius: 10px 0 0 10px; box-shadow: inset -26px 0 34px -18px rgba(60, 50, 120, .35); }
	.page.r { left: 270px; border-radius: 0 10px 10px 0; background: linear-gradient(270deg, #f1efe8, #fffdf8 35%, #fff); box-shadow: inset 26px 0 34px -18px rgba(60, 50, 120, .35); }
	.in { padding: 32px; }
	.hd { height: 16px; width: 62%; border-radius: 4px; background: #1f2347; margin-bottom: 14px; }
	.hd.s { width: 36%; height: 10px; background: #6366f1; margin-bottom: 20px; }
	.ln { height: 8px; border-radius: 4px; background: #d9dbe8; margin-bottom: 11px; }
	.w9 { width: 92%; } .w8 { width: 80%; } .w6 { width: 62%; }
	.fig { height: 104px; border-radius: 10px; margin: 18px 0; background: linear-gradient(135deg, #4f46e5, #7c3aed); position: relative; overflow: hidden; }
	.fig i { position: absolute; bottom: 0; width: 24px; background: rgba(255, 255, 255, .85); border-radius: 5px 5px 0 0; }
	.fig i:nth-child(1) { left: 20px; height: 38px; } .fig i:nth-child(2) { left: 58px; height: 62px; opacity: .8; }
	.fig i:nth-child(3) { left: 96px; height: 48px; } .fig i:nth-child(4) { left: 134px; height: 82px; opacity: .85; }
	.fig i:nth-child(5) { left: 172px; height: 58px; } .fig i:nth-child(6) { left: 210px; height: 90px; opacity: .9; }
	.spine { position: absolute; left: 266px; top: -2px; width: 8px; height: 364px; background: linear-gradient(90deg, rgba(60, 50, 120, .5), rgba(255, 255, 255, .5), rgba(60, 50, 120, .5)); z-index: 3; }
	.turn { position: absolute; left: 270px; top: 0; width: 270px; height: 360px; transform-origin: 0 50%; transform: rotateY(-40deg); z-index: 4;
		background: linear-gradient(90deg, #d9d6f0 0%, #fffdf8 40%, #f3f1ff 100%); border-radius: 0 10px 10px 0; box-shadow: 34px 22px 64px rgba(10, 8, 40, .6); }
	.turn::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(79, 70, 229, .2), transparent 55%); }

	.free { position: absolute; right: 56px; top: 56px; z-index: 9; padding: 14px 34px; border-radius: 16px; font-size: 54px; font-weight: 800; letter-spacing: 1px; color: #1b1200;
		background: linear-gradient(135deg, #fde68a, #fbbf24); box-shadow: 0 16px 36px -10px rgba(0, 0, 0, .6); transform: rotate(4deg); }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>

<div class="copy">
	<div class="brand"><img src="../wporg-assets/icon.svg" alt=""><b>Flipset</b></div>
	<h1>PDF Viewer<em>+ 3D Flipbook</em></h1>
	<div class="chip">for WordPress</div>
</div>

<div class="stage">
	<div class="book">
		<div class="shadow"></div>
		<div class="page l"><div class="in"><div class="hd s"></div><div class="hd"></div>
			<div class="ln w9"></div><div class="ln"></div><div class="ln w8"></div><div class="ln w6"></div>
			<div class="fig"><i></i><i></i><i></i><i></i><i></i><i></i></div>
			<div class="ln"></div><div class="ln w9"></div><div class="ln w8"></div></div></div>
		<div class="page r"><div class="in"><div class="hd s"></div><div class="hd" style="width:48%"></div>
			<div class="ln"></div><div class="ln w8"></div><div class="ln w9"></div><div class="ln w6"></div>
			<div class="ln"></div><div class="ln w9"></div><div class="ln w8"></div><div class="ln"></div>
			<div class="ln w6"></div><div class="ln w9"></div></div></div>
		<div class="spine"></div>
		<div class="turn"><div class="in"><div class="hd s"></div><div class="hd" style="width:70%"></div>
			<div class="ln w9"></div><div class="ln"></div><div class="ln w8"></div><div class="ln w9"></div><div class="ln w6"></div><div class="ln"></div></div></div>
	</div>
	<div class="free">FREE</div>
</div>
</body>
</html>
